name: Retrieval benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "src/grounded_llm/benchmark.py"
      - "src/grounded_llm/retrieval.py"
      - "benchmarks/**"
      - "scripts/prepare_benchmark.py"
      - "scripts/run_retrieval_benchmark.py"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths:
      - "src/grounded_llm/benchmark.py"
      - "src/grounded_llm/retrieval.py"
      - "benchmarks/**"
      - "scripts/prepare_benchmark.py"
      - "scripts/run_retrieval_benchmark.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zephyr-bt-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify and prepare pinned public corpus
        run: python scripts/prepare_benchmark.py

      - name: Run BM25 retrieval baseline
        run: python scripts/run_retrieval_benchmark.py

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zephyr-bt-v1-retrieval-report
          path: benchmark-results/zephyr_bt_v1.json
          if-no-files-found: warn
          retention-days: 90
